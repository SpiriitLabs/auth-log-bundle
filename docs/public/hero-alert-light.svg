      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(17,24,39,0.16)" flood-opacity="1"/>
    </filter>
  </defs>

  <g filter="url(#sh)">
    <rect x="14" y="14" width="372" height="268" rx="18" fill="#ffffff" stroke="#e6e8ec"/>
  </g>

  <text x="38" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">New sign-in detected</text>
  <text x="38" y="79" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280">a moment ago</text>

  <rect x="38" y="104" width="324" height="1" fill="#e6e8ec"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#6b7280">
    <text x="38" y="140">Location</text>
