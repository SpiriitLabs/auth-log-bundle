  <rect x="200" y="232" width="162" height="34" rx="17" fill="#26272e" stroke="#3c3d47"/>
  <text x="281" y="254" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f3f4f6" text-anchor="middle">It wasn't me</text>
