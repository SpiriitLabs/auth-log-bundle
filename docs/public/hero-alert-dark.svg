  <text x="38" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f4f6">New sign-in detected</text>
  <text x="38" y="79" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#9ca3af">a moment ago</text>

  <rect x="38" y="104" width="324" height="1" fill="#32333b"/>

